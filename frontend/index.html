<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trader Sahab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --surface: #FFFFFF;
    --paper: #F3F5F8;
    --sunken: #F3F5F8;
    --ink: #162230;
    --ink-2: #536170;
    --ink-3: #8592A0;
    --rule: #E1E6EC;
    --long: #0B7A5C;
    --long-bg: #E2F2EC;
    --short: #B3261E;
    --short-bg: #FAE8E6;
    --wait: #8A5A00;
    --wait-bg: #FBF0DA;
    --focus: #3A4FD0;
    --focus-bg: #EEF0FC;
    --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #131A22;
      --paper: #0F151C;
      --sunken: #1A232D;
      --ink: #E6EBF0;
      --ink-2: #A5B2BF;
      --ink-3: #7C8996;
      --rule: #25303B;
      --long: #45C595;
      --long-bg: #16322B;
      --short: #F27D73;
      --short-bg: #3B1E1C;
      --wait: #E5B04D;
      --wait-bg: #342A1A;
      --focus: #9DA9FF;
      --focus-bg: #1F2645;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    background: var(--surface); color: var(--ink);
    font-family: var(--font); font-size: 15px; line-height: 1.5;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .up { color: var(--long); }
  .down { color: var(--short); }
  .muted { color: var(--ink-2); font-weight: 400; }
  .empty { margin: 16px 0; font-size: 14px; color: var(--ink-2); }

  /* ---- Top bar ---- */
  .topbar {
    flex: none; display: flex; align-items: center; gap: 20px;
    height: 56px; padding: 0 20px; border-bottom: 1px solid var(--rule);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
  .brand b { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .brand span { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
  .dot.open { background: var(--long); box-shadow: 0 0 0 3px var(--long-bg); }
  .stat { display: flex; flex-direction: column; line-height: 1.25; }
  .stat small { font-size: 12px; color: var(--ink-2); }
  .stat strong { font-size: 15px; font-weight: 600; }
  .divider { flex: none; width: 1px; height: 28px; background: var(--rule); }
  .kite { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .btn {
    height: 32px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 6px;
    background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-3); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .segmented { display: inline-flex; height: 32px; padding: 2px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sunken); }
  .segmented button { border: 0; background: none; padding: 0 12px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--ink-2); }
  .segmented .paper[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(22, 34, 48, 0.14); }
  .segmented .live[aria-pressed="true"] { background: var(--short); color: #fff; }

  /* ---- Stance strip ---- */
  .stance {
    flex: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 32px; align-items: start;
    padding: 18px 20px 16px; background: var(--paper); border-bottom: 1px solid var(--rule);
  }
  .stance-text { min-width: 0; }
  .stance h1 { margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600; letter-spacing: -0.015em; }
  .stance p { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }
  .scan { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-top: 2px; }
  .scan small { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .facts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 0; margin: 14px 0 0; }
  .facts div { display: flex; flex-direction: column; padding: 0 24px; border-left: 1px solid var(--rule); }
  .facts div:first-child { padding-left: 0; border-left: 0; }
  .facts dt { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .facts dd { margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .pane-note { margin: 10px 0 2px; font-size: 13px; color: var(--ink-2); }

  /* ---- Three panes ---- */
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px minmax(0, 1fr) 360px; }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--rule); }
  .pane:last-child { border-right: 0; }
  .pane-head { flex: none; padding: 16px 16px 0; }
  .pane-title { margin: 0; font-size: 15px; font-weight: 600; }
  .pane-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 24px; }
  .tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--rule); }
  .tab { position: relative; padding: 10px 0; border: 0; background: none; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ink); }
  .tab .n { margin-left: 4px; font-weight: 400; color: var(--ink-3); }

  /* ---- Opportunities ---- */
  .opp {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px;
    width: calc(100% + 16px); margin: 0 -8px; padding: 10px 8px;
    border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; cursor: pointer;
  }
  .opp:hover { background: var(--sunken); }
  .opp[aria-current="true"] { background: var(--focus-bg); box-shadow: inset 3px 0 0 var(--focus); }
  .opp-name { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 600; }
  .opp-score { text-align: right; font-weight: 600; }
  .opp-why { font-size: 13px; line-height: 1.4; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .opp-chg { text-align: right; font-size: 13px; }
  .pill { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.long { background: var(--long-bg); color: var(--long); }
  .pill.short { background: var(--short-bg); color: var(--short); }
  .pill.wait { background: var(--wait-bg); color: var(--wait); }
  .pill.neutral { background: var(--sunken); color: var(--ink-2); }
  .pill.solid { background: var(--ink); color: var(--surface); }
  .more { padding: 12px 0 0; border: 0; background: none; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--focus); }

  /* ---- Selected stock ---- */
  .stock-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .stock-head h2 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; }
  .stock-head p { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); }
  .price { text-align: right; font-size: 24px; line-height: 1.2; font-weight: 600; }
  .price small { display: block; margin-top: 2px; font-size: 13px; font-weight: 500; }
  .plan { margin: 14px 0 12px; padding: 12px 14px; border-radius: 8px; background: var(--sunken); box-shadow: inset 3px 0 0 var(--ink-3); }
  .plan.long { box-shadow: inset 3px 0 0 var(--long); }
  .plan.short { box-shadow: inset 3px 0 0 var(--short); }
  .plan.wait { box-shadow: inset 3px 0 0 var(--wait); }
  .plan h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .plan p { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }
  .plan ul { margin: 4px 0 0; padding-left: 18px; font-size: 14px; color: var(--ink-2); }
  .levels { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
  .levels b { font-weight: 600; color: var(--ink); }
  #chart { height: 280px; margin: 0 -8px 4px; }
  .chart-empty { height: 100%; display: grid; place-items: center; border-radius: 8px; background: var(--sunken); font-size: 14px; color: var(--ink-2); }
  .tab-content { padding-top: 16px; }
  .lede { margin: 0 0 16px; max-width: 80ch; font-size: 14px; color: var(--ink-2); }
  .cases { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .case h4 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0; font-size: 14px; font-weight: 600; }
  .meter { position: relative; height: 6px; margin: 8px 0 8px; border-radius: 999px; background: var(--sunken); }
  .meter i { display: block; height: 100%; border-radius: 999px; }
  .meter b { position: absolute; top: -3px; width: 2px; height: 12px; border-radius: 1px; background: var(--ink); }
  .evidence { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
  .evidence li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-top: 1px solid var(--rule); }
  .evidence li:first-child { border-top: 0; }
  .checklist { list-style: none; margin: 0 0 8px; padding: 0; }
  .check { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-top: 1px solid var(--rule); font-size: 14px; line-height: 1.4; }
  .check:first-child { border-top: 0; }
  .check .mark { font-weight: 700; }
  .check.pass .mark { color: var(--long); }
  .check.fail .mark { color: var(--short); }
  .check.soft .mark { color: var(--wait); }
  .check .muted { font-size: 13px; }
  .check .source { font-size: 11.5px; color: var(--focus); }
  .tax { margin: 12px 0 4px; padding: 10px 12px; border-radius: 8px; background: var(--sunken); font-size: 13px; line-height: 1.45; color: var(--ink-2); }
  .tax strong { color: var(--ink); }
  .pts { font-weight: 600; }
  .pts.penalty { color: var(--wait); }
  .facts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px 16px; margin: 20px 0 0; }
  .facts-grid dt { font-size: 12px; color: var(--ink-2); }
  .facts-grid dd { margin: 0; font-size: 15px; font-weight: 600; }
  .sub-title { margin: 24px 0 8px; font-size: 14px; font-weight: 600; }
  .note { margin: 16px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--sunken); font-size: 14px; }

  /* ---- Feeds (activity, trades, news) ---- */
  .positions { padding: 4px 0 0; }
  .position { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
  .position .muted { font-size: 13px; }
  .symlink { padding: 0; border: 0; background: none; cursor: pointer; font-weight: 600; text-decoration: underline; text-decoration-color: var(--rule); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .symlink:hover { text-decoration-color: var(--focus); }
  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 14px; line-height: 1.45; }
  .feed .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 2px; font-size: 12.5px; color: var(--ink-2); }
  .feed .meta span:first-child { display: flex; align-items: baseline; gap: 6px; }
  .feed .body { color: var(--ink); }
  .feed .detail { margin-top: 2px; font-size: 13px; color: var(--ink-2); }
  .feed a { text-decoration: none; }
  .feed a:hover { text-decoration: underline; }
  .kind { font-weight: 600; color: var(--ink); }
  .kind.trade { color: var(--long); }
  .kind.blocked, .kind.risk { color: var(--wait); }
  .kind.error { color: var(--short); }
  .kind.scan, .kind.watchlist { color: var(--focus); }

  @media (max-width: 1180px) {
    .app { grid-template-columns: 290px minmax(0, 1fr) 320px; }
    .facts div:nth-child(n+4) { display: none; }
  }
  @media (max-width: 1000px) {
    body { height: auto; overflow: auto; }
    .app { grid-template-columns: minmax(0, 1fr); }
    .pane { border-right: 0; border-bottom: 1px solid var(--rule); }
    .pane-body { overflow: visible; }
    .pane.center { order: -1; }
    .facts div:nth-child(n+4) { display: flex; }
  }
  @media (max-width: 640px) {
    .topbar { flex-wrap: wrap; height: auto; padding: 10px 16px; gap: 10px 16px; }
    .divider { display: none; }
    .stance { padding: 16px; grid-template-columns: minmax(0, 1fr); }
    .scan { align-items: flex-start; margin-top: 12px; }
    .facts { gap: 10px 24px; }
    .facts div { padding: 0; border-left: 0; }
    .cases { grid-template-columns: minmax(0, 1fr); }
    .stock-head h2, .price { font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot" id="market-dot"></span><b>Trader Sahab</b><span id="market-status">Connecting…</span></div>
  <div class="stat"><small>Realized today</small><strong id="realized">₹0</strong></div>
  <div class="stat"><small>Open P&amp;L</small><strong id="unrealized">₹0</strong></div>
  <span class="divider"></span>
  <div class="kite"><span id="kite-label">Checking Kite…</span><button class="btn" id="btn-connect-kite">Connect</button></div>
  <div class="segmented" role="group" aria-label="Trading mode">
    <button class="paper" id="btn-paper" aria-pressed="true">Paper</button>
    <button class="live" id="btn-live" aria-pressed="false">Live</button>
  </div>
</header>

<section class="stance" aria-live="polite">
  <div class="stance-text">
    <h1 id="stance-lead">Connecting to Trader Sahab…</h1>
    <p id="stance-rest">If this doesn't change in a few seconds, start the backend with uvicorn app:app --port 8000.</p>
  </div>
  <div class="scan"><button class="btn primary" id="btn-scan">Scan now</button><small id="scan-info"></small></div>
  <dl class="facts" id="stance-facts"></dl>
</section>

<div class="app">
  <aside class="pane left" aria-labelledby="opp-title">
    <div class="pane-head">
      <h2 class="pane-title" id="opp-title">Opportunities</h2>
      <div class="tabs" role="tablist" id="left-tabs"></div>
    </div>
    <div class="pane-body" id="opps"></div>
  </aside>

  <main class="pane center">
    <div class="pane-head">
      <div id="stock-head"></div>
      <div id="plan"></div>
    </div>
    <div class="pane-body">
      <div id="chart"></div>
      <div class="tabs" role="tablist" id="center-tabs"></div>
      <div class="tab-content" id="center-content"></div>
    </div>
  </main>

  <aside class="pane right" aria-label="Positions and activity">
    <div class="pane-head">
      <h2 class="pane-title">Open positions</h2>
      <div class="positions" id="positions"></div>
      <div class="tabs" role="tablist" id="right-tabs"></div>
    </div>
    <div class="pane-body"><ul class="feed" id="right-content"></ul></div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
// ?api=http://localhost:8765 points the dashboard at a backend on another local port.
const API_OVERRIDE = new URLSearchParams(window.location.search).get("api");
const API_BASE = API_OVERRIDE && /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(API_OVERRIDE)
  ? API_OVERRIDE
  : window.location.hostname === "" ? "http://localhost:8000" : `${window.location.protocol}//${window.location.hostname}:8000`;
const IST_OFFSET_S = 19800;
const REASON_TEXT = {
  stop_loss: "Stop-loss hit", take_profit: "Target hit", auto_square_off: "15:15 square-off",
  brain_exit: "Exit signal", brain_cover: "Cover signal", signal: "Signal",
};
const KIND_TEXT = {
  scan: "Scan", watchlist: "Watchlist", setup: "Setup forming", trade: "Trade",
  blocked: "Skipped", risk: "Risk", error: "Problem", system: "System",
};

const ui = { left: "trading", center: "timing", right: "activity", showAllWatch: false };
let selectedSymbol = null;
let userSelected = false;
let chart = null, series = null;
let priceLines = [];
let priceLineKey = "";
let latestState = null;
let lastChartedSymbol = null;
let lastChartFetchTs = 0;
const newsCache = {};
let journalCache = null;

const $ = id => document.getElementById(id);
function setHTML(el, html) {
  if (el && el._html !== html) { el.innerHTML = html; el._html = html; }
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, ch => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[ch]));
}
function num(n, d = 2) {
  return n === null || n === undefined || Number.isNaN(Number(n)) ? "—"
    : Number(n).toLocaleString("en-IN", {minimumFractionDigits: d, maximumFractionDigits: d});
}
function pct(n, d = 1) {
  return n === null || n === undefined ? "—" : `${n > 0 ? "+" : n < 0 ? "−" : ""}${Math.abs(n).toFixed(d)}%`;
}
function signed(n, d = 1) {
  return n === null || n === undefined ? "—" : `${n > 0 ? "+" : n < 0 ? "−" : ""}${Math.abs(n).toFixed(d)}`;
}
function tone(n) { return n > 0 ? "up" : n < 0 ? "down" : ""; }
function money(n) {
  if (n === null || n === undefined) return "—";
  return `${n < 0 ? "−" : n > 0 ? "+" : ""}₹${Math.abs(n).toLocaleString("en-IN", {maximumFractionDigits: 0})}`;
}
function clock(ts) { return new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}); }
function dateLabel(iso) { return new Date(`${iso}T00:00:00`).toLocaleDateString("en-IN", {day: "numeric", month: "short"}); }
function safeUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null; }
function symLink(sym) { return `<button class="symlink" data-sym="${esc(sym)}">${esc(sym)}</button>`; }
function joinWords(items) {
  if (items.length <= 1) return items.join("");
  return `${items.slice(0, -1).join(", ")} and ${items[items.length - 1]}`;
}
function sentiment(score) {
  if (score >= 0.15) return {word: "Positive", cls: "up"};
  if (score <= -0.15) return {word: "Negative", cls: "down"};
  return {word: "Neutral", cls: "muted"};
}
function tabsHTML(group, current, tabs) {
  return tabs.map(([key, label, count]) =>
    `<button class="tab" role="tab" data-group="${group}" data-tab="${key}" aria-selected="${key === current}">${label}${count !== undefined ? `<span class="n">${count}</span>` : ""}</button>`
  ).join("");
}

function scanRows(s) { return (s.scanner && s.scanner.rows) || []; }
function rowFor(s, sym) { return scanRows(s).find(r => r.symbol === sym) || null; }
function heldSymbols(s) { return Object.entries(s.positions).filter(([, p]) => p.quantity !== 0).map(([k]) => k); }
function analysisFor(s, sym) {
  const live = sym && s.indicators[sym];
  if (live && live.bull_score !== undefined) return {b: live, live: true};
  const r = sym && rowFor(s, sym);
  if (r && r.brain) return {b: r.brain, live: false};
  return null;
}
function isReady(s, r) {
  const a = analysisFor(s, r.symbol);
  return r.status === "ACTIVE" && a && (r.side === "SHORT" ? a.b.short_ok : a.b.long_ok);
}
function sidePill(side, suffix = "") {
  return side === "SHORT" ? `<span class="pill short">Short${suffix}</span>` : `<span class="pill long">Long${suffix}</span>`;
}

// ---- top bar + stance ---------------------------------------------------

function renderTop(s) {
  const open = s.market_status === "open";
  $("market-dot").className = "dot" + (open ? " open" : "");
  $("market-status").textContent = `${open ? "Market open" : "Market closed"}${s.last_update_ts ? `, updated ${clock(s.last_update_ts)}` : ""}`;
  const r = $("realized");
  r.textContent = money(s.realized_pnl_today);
  r.className = tone(s.realized_pnl_today);
  const u = $("unrealized");
  u.textContent = money(s.unrealized_pnl);
  u.className = tone(s.unrealized_pnl);
  $("btn-paper").setAttribute("aria-pressed", String(s.paper_mode));
  $("btn-live").setAttribute("aria-pressed", String(!s.paper_mode));
}

function renderStance(s) {
  const m = s.market, sc = s.scanner;
  if (!m) {
    setHTML($("stance-lead"), "Reading the market for the first time…");
    setHTML($("stance-rest"), "Trader Sahab is downloading prices for all NIFTY 100 stocks. This takes about 30 seconds.");
    setHTML($("stance-facts"), "");
    setHTML($("scan-info"), "");
    return;
  }
  const lead = {
    "risk-off": "The market is weak, so Trader Sahab is looking for stocks to short.",
    "risk-on": "The market is strong, so Trader Sahab is looking for stocks to buy.",
    "neutral": "The market is mixed, so Trader Sahab trades both sides on clear setups only.",
  }[m.bias] || "Reading the market.";

  const n = m.nifty;
  const closed = s.market_status !== "open";
  const sides = Object.values((sc && sc.active_sides) || {});
  const shorts = sides.filter(x => x === "SHORT").length;
  const longs = sides.length - shorts;
  const held = heldSymbols(s).length;
  const sentences = [
    `NIFTY ${n.chg_pct >= 0 ? "rose" : "fell"} ${Math.abs(n.chg_pct).toFixed(2)}% ${closed ? `on ${dateLabel(m.session_date)}` : "today"} and ${m.breadth.dec} of ${m.breadth.adv + m.breadth.dec} stocks fell.`,
    sides.length ? `Tracking ${sides.length} stocks, ${shorts} to short and ${longs} to buy.` : "No stock passes every filter yet.",
    held ? `${held} open position${held > 1 ? "s" : ""}.` : "No open positions.",
  ];
  if (m.vix_high) sentences.push(`India VIX is high, so new positions are half size.`);
  if (closed) sentences.push("Trading resumes at 9:15.");
  setHTML($("stance-lead"), esc(lead));
  setHTML($("stance-rest"), esc(sentences.join(" ")));

  const sectors = (sc && sc.sectors) || [];
  const fact = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
  const sector = x => x ? `${esc(x.industry)} <span class="${tone(x.chg_pct)}">${pct(x.chg_pct)}</span>` : "—";
  setHTML($("stance-facts"), [
    fact("NIFTY 50", `${num(n.ltp, 0)} <span class="${tone(n.chg_pct)}">${pct(n.chg_pct, 2)}</span>`),
    fact("India VIX", num(m.vix, 1)),
    fact("Advancing", `<span class="up">${m.breadth.adv}</span> <span class="muted">of ${m.breadth.adv + m.breadth.dec}</span>`),
    fact("Strongest sector", sector(sectors[0])),
    fact("Weakest sector", sector(sectors[sectors.length - 1])),
  ].join(""));
  setHTML($("scan-info"), sc ? `Scanned ${sc.scanned} stocks at ${clock(sc.ts)}` : "");
}

// ---- left pane: opportunities --------------------------------------------

function oppRow(s, r, held) {
  let flag = "";
  if (held.has(r.symbol)) flag = `<span class="pill solid">Holding</span>`;
  else if (isReady(s, r)) flag = `<span class="pill solid">Ready</span>`;
  const why = r.excluded || (r.reasons || []).slice(0, 2).map(x => x.text).join("; ");
  return `<button class="opp" data-sym="${esc(r.symbol)}" aria-current="${r.symbol === selectedSymbol}">
    <span class="opp-name">${esc(r.symbol)} ${r.excluded ? `<span class="pill neutral">Skipped</span>` : sidePill(r.side)} ${flag}</span>
    <span class="opp-score" title="Scan score">${r.excluded ? "" : num(r.final_score, 0)}</span>
    <span class="opp-why">${esc(why)}</span>
    <span class="opp-chg ${tone(r.chg_pct)}">${pct(r.chg_pct)}</span>
  </button>`;
}

function renderOpps(s) {
  const rows = scanRows(s);
  const held = new Set(heldSymbols(s));
  const groups = {
    trading: rows.filter(r => r.status === "ACTIVE" || held.has(r.symbol)),
    watch: rows.filter(r => r.status === "WATCH" && !held.has(r.symbol)),
    skipped: rows.filter(r => r.excluded && !held.has(r.symbol)),
  };
  setHTML($("left-tabs"), tabsHTML("left", ui.left, [
    ["trading", "Trading", groups.trading.length],
    ["watch", "Watching", groups.watch.length],
    ["skipped", "Skipped", groups.skipped.length],
  ]));
  if (!rows.length) {
    setHTML($("opps"), `<p class="empty">The first scan is running. Ranked stocks appear here in about 30 seconds.</p>`);
    return;
  }
  const list = groups[ui.left];
  const intro = {
    trading: "Trader Sahab checks these for entries every 30 seconds.",
    watch: "Ranked candidates that didn't make the active list.",
    skipped: "Filtered out today, with the reason.",
  }[ui.left];
  let shown = list;
  if (ui.left === "watch" && !ui.showAllWatch) shown = list.slice(0, 15);
  let html = `<p class="pane-note">${intro}</p>`;
  html += shown.length ? shown.map(r => oppRow(s, r, held)).join("") : `<p class="empty">Nothing here right now.</p>`;
  if (ui.left === "watch" && list.length > 15) {
    html += `<button class="more" id="btn-toggle-watch">${ui.showAllWatch ? "Show top 15" : `Show all ${list.length}`}</button>`;
  }
  setHTML($("opps"), html);
}

// ---- center pane: selected stock -----------------------------------------

function planHTML(s, r, b, pos) {
  const box = (cls, title, body) => `<div class="plan ${cls}"><h3>${title}</h3>${body}</div>`;
  const levels = [];
  if (b && b.support) levels.push(`<span>Support <b>${num(b.support)}</b></span>`);
  if (b && b.resistance) levels.push(`<span>Resistance <b>${num(b.resistance)}</b></span>`);
  if (b && b.vwap) levels.push(`<span>VWAP <b>${num(b.vwap)}</b></span>`);
  const lv = levels.length ? `<div class="levels">${levels.join("")}</div>` : "";

  if (pos && pos.quantity) {
    const long = pos.quantity > 0;
    const exits = pos.stop_price ? ` Stop ${num(pos.stop_price)}, target ${num(pos.target_price)}.` : "";
    return box(long ? "long" : "short", `Holding ${Math.abs(pos.quantity)} shares ${long ? "long" : "short"}`,
      `<p>Entered at ${num(pos.avg_price)}, open P&amp;L <span class="${tone(pos.unrealized_pnl)}">${money(pos.unrealized_pnl)}</span>.${exits} Closes at the stop, the target, an exit signal or 15:15.</p>${lv}`);
  }
  if (r && r.excluded) return box("", "No trade in this stock today", `<p>${esc(r.excluded)}</p>`);
  const side = r ? r.side : (b && b.bias === "short" ? "SHORT" : "LONG");
  const verb = side === "SHORT" ? "short" : "buy";
  if (!b) {
    return box("wait", `Watching for a chance to ${verb}`, `<p>A timing read appears once this stock ranks in the top 15 or is tracked.</p>`);
  }
  const m = s.market || {};
  const paused = (side === "LONG" && m.bias === "risk-off") || (side === "SHORT" && m.bias === "risk-on");
  const ready = side === "SHORT" ? b.short_ok : b.long_ok;
  const cl = b.checklist && b.checklist[side === "SHORT" ? "short" : "long"];
  if (ready && !paused && (!r || r.status === "ACTIVE")) {
    const planLine = cl && cl.stop != null
      ? `<p>Enter near ${num(cl.entry)}, stop ${num(cl.stop)}, target ${num(cl.target)}, reward-to-risk ${num(cl.rrr)} after costs, at ${Math.round(cl.size_factor * 100)}% size.</p>`
      : `<p>Every entry condition is met. The order goes in on the next check if risk limits allow.</p>`;
    return box(side === "SHORT" ? "short" : "long", `Ready to ${verb}`, planLine + lv);
  }
  const waits = [];
  if (paused) waits.push(`New ${side === "LONG" ? "longs" : "shorts"} are paused while the market is ${m.bias === "risk-off" ? "weak" : "strong"}`);
  if (r && r.status !== "ACTIVE") waits.push("A place in the active list");
  (b.blockers || []).forEach(x => waits.push(esc(x)));
  return box("wait", `Waiting to ${verb}`,
    (waits.length ? `<ul>${waits.map(w => `<li>${w}</li>`).join("")}</ul>` : `<p>Conditions are close. Waiting for the next candle.</p>`) + lv);
}

function caseHTML(title, value, thr, color, items, emptyText) {
  const scale = thr * 1.6;
  const width = Math.max(0, Math.min(100, (value / scale) * 100));
  const mark = (thr / scale) * 100;
  const list = items.length
    ? items.map(x => `<li><span class="pts ${x.points < 0 ? "penalty" : ""}">${signed(x.points, 1)}</span><span>${esc(x.text)}</span></li>`).join("")
    : `<li><span></span><span class="muted">${emptyText}</span></li>`;
  return `<div class="case">
    <h4><span>${title}</span><span>${num(value, 1)} <span class="muted">of ${thr}</span></span></h4>
    <div class="meter" role="img" aria-label="${title}: ${num(value, 1)} of ${thr} needed"><i style="width:${width}%;background:${color}"></i><b style="left:${mark}%"></b></div>
    <ul class="evidence">${list}</ul>
  </div>`;
}

function checklistHTML(r, b) {
  if (!b.checklist) return "";
  const side = r && r.side ? r.side.toLowerCase() : (b.bias === "short" ? "short" : "long");
  const cl = b.checklist[side] || b.checklist.long;
  if (!cl) return "";
  const failing = cl.items.filter(i => i.required && !i.ok).length;
  const rows = cl.items.map(i => {
    const state = i.ok ? "pass" : i.required ? "fail" : "soft";
    const mark = i.ok ? "✓" : i.required ? "✗" : "–";
    return `<li class="check ${state}"><span class="mark" aria-label="${state}">${mark}</span>
      <span>${esc(i.label)}${i.required ? "" : ` <span class="muted">(sizes the trade)</span>`}<br><span class="muted">${esc(i.detail)}</span><br><span class="source">${esc(i.source)}</span></span></li>`;
  }).join("");
  const summary = cl.passed
    ? `Every required point passes for a ${cl.side}.`
    : `${failing} required point${failing > 1 ? "s" : ""} fail${failing > 1 ? "" : "s"}, so there's no ${cl.side} trade.`;
  const plan = cl.stop != null
    ? ` If taken: entry ${num(cl.entry)}, stop ${num(cl.stop)}, target ${num(cl.target)}, reward-to-risk ${num(cl.rrr)}.` : "";
  return `<h3 class="sub-title" style="margin-top:0">Zerodha Varsity checklist</h3>
    <p class="lede">${summary}${plan} Trader Sahab uses this same checklist to decide every trade — the source of each rule is linked below so you can read the lesson yourself.</p>
    <ul class="checklist">${rows}</ul>`;
}

function timingHTML(r, a) {
  if (!a) return `<p class="empty">No timing read yet. It runs on the scanner's top 15 and on every tracked stock while the market is open.</p>`;
  const b = a.b;
  const checklist = b.entry_mode === "checklist" ? checklistHTML(r, b) : "";
  const patterns = (b.patterns || []).map(p => esc(p.name));
  const context = `${a.live ? "Live read." : "From the last scan."} The stock is ${esc(b.regime)} (ADX ${num(b.adx, 0)}), its swing structure is ${esc(b.structure)}, and the 15-minute trend is ${esc(b.htf_trend)}. RSI ${num(b.rsi, 0)}${b.volume_ratio != null ? `, volume ${num(b.volume_ratio, 1)}× average` : ""}.${patterns.length ? ` Candle patterns: ${joinWords(patterns)}.` : ""}`;
  return `${checklist}
    ${checklist ? `<h3 class="sub-title">Supporting evidence</h3>` : ""}
    <p class="lede">${context}</p>
    <div class="cases">
      ${caseHTML("Case for buying", b.bull_score, b.entry_threshold, "var(--long)", b.reasons || [], "Nothing bullish yet.")}
      ${caseHTML("Case for shorting", b.bear_score, b.entry_threshold, "var(--short)", b.bear_reasons || [], "Nothing bearish yet.")}
    </div>`;
}

function scanHTML(r) {
  if (!r) return `<p class="empty">This stock isn't in the latest scan. It's tracked because it's pinned or held.</p>`;
  const reasons = (r.reasons || []).map(x => `<li><span class="pts ${x.points < 0 ? "penalty" : ""}">${signed(x.points, 0)}</span><span>${esc(x.text)}</span></li>`).join("");
  const f = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
  const cat = r.catalyst
    ? `<p class="note"><span class="${sentiment(r.catalyst.score).cls}">${sentiment(r.catalyst.score).word} catalyst.</span> ${esc(r.catalyst.top)}</p>` : "";
  const swing = (r.swing_patterns || []).map(sw =>
    `<p class="note">Confirmed <strong>${esc(sw.name)}</strong> on the daily chart (${sw.side}), Bulkowski's neckline/confirmation level ${num(sw.level)}, structural stop ${num(sw.stop)}. Source: Bulkowski, <em>Encyclopedia of Chart Patterns</em> — a daily-chart, US-stock statistic used here as a directional weight, not a guarantee for this market or timeframe.</p>`
  ).join("");
  return `<p class="lede">Ranked #${r.rank} of ${latestState ? scanRows(latestState).length : 100}. As a long it scores ${signed(r.long_score, 0)}, as a short ${signed(r.short_score, 0)}; the stronger side is kept.</p>
    <ul class="evidence">${reasons || `<li><span></span><span class="muted">No strong factors either way.</span></li>`}</ul>
    ${swing}
    <dl class="facts-grid">
      ${f("Opening gap", pct(r.gap_pct))}
      ${f("Versus NIFTY today", `<span class="${tone(r.rs_today)}">${pct(r.rs_today)}</span>`)}
      ${f("Volume vs usual", r.rvol == null ? "—" : `${num(r.rvol, 1)}×`)}
      ${f("Daily range", `${num(r.atr_pct, 1)}%`)}
      ${f("Versus NIFTY, 10 days", `<span class="${tone(r.rs10)}">${pct(r.rs10)}</span>`)}
      ${f("Daily trend", esc(r.daily_trend))}
      ${f("Below 52-week high", `${num(r.pct_from_high, 1)}%`)}
      ${f("Above 52-week low", `${num(r.pct_from_low, 1)}%`)}
      ${f("Daily turnover", `₹${num(r.turnover_cr, 0)} cr`)}
      ${f("Beta vs NIFTY", r.beta == null ? "—" : num(r.beta, 2))}
    </dl>${cat}`;
}

function newsHTML(s) {
  const sym = selectedSymbol;
  const n = sym && newsCache[sym];
  let html;
  if (!n) html = `<p class="empty">Loading headlines…</p>`;
  else if (n.error) html = `<p class="empty">Couldn't load news (${esc(n.error)}). Retrying every minute.</p>`;
  else {
    const overall = sentiment(n.score);
    const sources = Object.entries(n.sources || {}).filter(([, v]) => v).map(([k, v]) => `${v} from ${esc(k)}`);
    html = `<p class="lede">Overall tone is <span class="${overall.cls}">${overall.word.toLowerCase()}</span> (${signed(n.score, 2)}) across ${joinWords(sources) || "no sources"} in the last 72 hours.</p>`;
    html += n.headlines.length ? `<ul class="feed">${n.headlines.map(h => {
      const url = safeUrl(h.url);
      const t = sentiment(h.score);
      return `<li><div class="meta"><span><span class="${t.cls}">${t.word}</span> ${esc(h.publisher || h.source)}</span><span>${num(h.age_h, 0)}h ago</span></div>
        <div class="body">${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(h.title)}</a>` : esc(h.title)}</div></li>`;
    }).join("")}</ul>` : `<p class="empty">No headlines name this company in the last 72 hours.</p>`;
  }
  const cats = scanRows(s).filter(r => r.catalyst).sort((a, b) => Math.abs(b.catalyst.score) - Math.abs(a.catalyst.score)).slice(0, 8);
  html += `<h3 class="sub-title">In the news across the NIFTY 100</h3>`;
  html += cats.length ? `<ul class="feed">${cats.map(r => {
    const t = sentiment(r.catalyst.score);
    return `<li><div class="meta"><span>${symLink(r.symbol)} <span class="${t.cls}">${t.word}</span></span></div><div class="detail">${esc(r.catalyst.top)}</div></li>`;
  }).join("")}</ul>` : `<p class="empty">No notable filings or headlines yet today.</p>`;
  return html;
}

function renderStock(s) {
  const sym = selectedSymbol;
  if (!sym) {
    setHTML($("stock-head"), `<p class="empty">Pick a stock from Opportunities to see the agent's plan for it.</p>`);
    setHTML($("plan"), "");
    setHTML($("center-tabs"), "");
    setHTML($("center-content"), "");
    return;
  }
  const r = rowFor(s, sym);
  const a = analysisFor(s, sym);
  const pos = s.positions[sym];
  const ltp = (s.indicators[sym] && s.indicators[sym].ltp) || (r && r.ltp);

  setHTML($("stock-head"), `<div class="stock-head">
    <div>
      <h2>${esc(sym)} ${r && !r.excluded ? sidePill(r.side, " idea") : ""}</h2>
      <p>${r ? `${esc(r.name)}, ${esc(r.industry)}` : "Pinned or held stock"}</p>
    </div>
    <div class="price">${num(ltp)}${r ? `<small class="${tone(r.chg_pct)}">${pct(r.chg_pct)} ${s.market_status === "open" ? "today" : "last session"}</small>` : ""}</div>
  </div>`);
  setHTML($("plan"), planHTML(s, r, a && a.b, pos));

  const news = newsCache[sym];
  setHTML($("center-tabs"), tabsHTML("center", ui.center, [
    ["timing", "Timing read"],
    ["scan", "Why it ranks"],
    ["news", "News", news && !news.error ? news.count : undefined],
  ]));
  const content = ui.center === "timing" ? timingHTML(r, a) : ui.center === "scan" ? scanHTML(r) : newsHTML(s);
  setHTML($("center-content"), content);
}

// ---- chart --------------------------------------------------------------

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function initChart() {
  const el = $("chart");
  if (typeof LightweightCharts === "undefined") {
    el.innerHTML = `<div class="chart-empty">The chart library didn't load. Check the internet connection; everything else still works.</div>`;
    return;
  }
  chart = LightweightCharts.createChart(el, {
    layout: { background: { color: "transparent" }, textColor: cssVar("--ink-3"), fontFamily: cssVar("--font"), fontSize: 11 },
    grid: { vertLines: { visible: false }, horzLines: { color: cssVar("--rule") } },
    rightPriceScale: { borderVisible: false },
    timeScale: { borderVisible: false, timeVisible: true, secondsVisible: false },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  });
  const up = cssVar("--long"), down = cssVar("--short");
  series = chart.addCandlestickSeries({ upColor: up, downColor: down, borderVisible: false, wickUpColor: up, wickDownColor: down });
  new ResizeObserver(entries => {
    for (const entry of entries) chart.resize(entry.contentRect.width, entry.contentRect.height);
  }).observe(el);
}

function updatePriceLines(a) {
  if (!series) return;
  const b = a ? a.b : null;
  const key = b ? [selectedSymbol, b.support, b.resistance, b.vwap].join("|") : selectedSymbol;
  if (key === priceLineKey) return;
  priceLineKey = key;
  priceLines.forEach(l => series.removePriceLine(l));
  priceLines = [];
  if (!b) return;
  const add = (price, color, title) => {
    if (price) priceLines.push(series.createPriceLine({ price, color, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title }));
  };
  add(b.support, cssVar("--long"), "Support");
  add(b.resistance, cssVar("--short"), "Resistance");
  add(b.vwap, cssVar("--focus"), "VWAP");
}

function renderChart(s) {
  const sym = selectedSymbol;
  const now = Date.now();
  if (sym && (sym !== lastChartedSymbol || now - lastChartFetchTs > 20000)) {
    lastChartedSymbol = sym;
    lastChartFetchTs = now;
    fetchCandles(sym);
  }
  updatePriceLines(analysisFor(s, sym));
}

async function fetchCandles(symbol) {
  if (!series) return;
  try {
    const res = await fetch(`${API_BASE}/api/candles/${encodeURIComponent(symbol)}`);
    const data = await res.json();
    if (symbol !== selectedSymbol) return;
    series.setData((data.candles || []).map(c => ({
      time: Math.floor(new Date(c.time).getTime() / 1000) + IST_OFFSET_S,
      open: c.open, high: c.high, low: c.low, close: c.close,
    })));
    chart.timeScale().fitContent();
  } catch (e) { /* the backend may not have candles for this stock yet */ }
}

// ---- right pane: positions, activity, trades -----------------------------

function renderPositions(s) {
  const held = Object.entries(s.positions).filter(([, p]) => p.quantity !== 0);
  setHTML($("positions"), held.length ? held.map(([sym, p]) => `
    <div class="position">
      <span>${symLink(sym)} ${sidePill(p.quantity > 0 ? "LONG" : "SHORT", ` ${Math.abs(p.quantity)}`)}<br><span class="muted">in at ${num(p.avg_price)}, now ${num(p.ltp)}</span></span>
      <strong class="${tone(p.unrealized_pnl)}">${money(p.unrealized_pnl)}</strong>
    </div>`).join("") : `<p class="empty" style="margin:4px 0 12px">None open. At most 3 at a time, all closed by 15:15.</p>`);
}

function tradeAction(t) {
  const r = t.reason || "";
  if (t.side === "BUY") return r.endsWith("(long)") ? "Bought" : "Covered short";
  return r.endsWith("(short)") ? "Sold short" : "Sold";
}

function fmtWhen(ts) {
  if (!ts) return "—";
  const days = Math.floor((Date.now() / 1000 - ts) / 86400);
  return days < 1 ? "today" : days === 1 ? "1 day ago" : `${days} days ago`;
}

function journalHTML(j) {
  if (!j) return `<li class="empty">Loading Sahab's Journal…</li>`;
  const ts = j.trade_stats || {};
  const rows = [
    `<li class="tax">Every scan and every checklist read — not just executed trades — is saved to a local database (backend/data/sahab_journal.db) so it survives a restart and builds into a knowledge base over time.
      <div class="detail" style="margin-top:6px">${num(j.scans_logged, 0)} scans · ${num(j.checklist_evals_logged, 0)} checklist reads · ${num(j.trades_logged, 0)} fills logged, since ${fmtWhen(j.logging_since)}.</div>
    </li>`,
  ];
  rows.push(ts.closed_trades
    ? `<li><div class="meta"><span><span class="kind">Trade record</span></span></div>
        <div class="body">${ts.closed_trades} closed trade${ts.closed_trades > 1 ? "s" : ""}, ${ts.win_rate_pct}% won</div>
        <div class="detail">Expectancy ${signed(ts.expectancy_r, 2)}R per trade (avg win ${signed(ts.avg_win_r, 2)}R, avg loss ${signed(ts.avg_loss_r, 2)}R). Kelly fraction ${ts.kelly_pct == null ? "—" : ts.kelly_pct + "%"}${ts.kelly_pct != null && ts.kelly_pct <= 0 ? " — no edge yet, the right bet size is zero" : ""}.</div>
      </li>`
    : `<li class="empty">No closed trades yet — nothing to score. This fills in once Sahab's Dimaag actually trades.</li>`);
  const breakdown = j.checklist_item_breakdown || {};
  const items = Object.entries(breakdown);
  if (items.length) {
    rows.push(`<li><div class="meta"><span><span class="kind">Which checklist rules actually matter</span></span></div>
      <div class="detail">Average R-multiple of closed trades where each rule passed vs failed at entry.</div>
      <table style="width:100%;margin-top:6px;font-size:12.5px"><tbody>
      ${items.map(([key, b]) => `<tr><td class="k" style="padding:2px 8px 2px 0">${esc(key)}</td>
        <td class="${b.pass.avg_r > 0 ? "up" : b.pass.avg_r < 0 ? "down" : ""}">pass ${b.pass.n ? signed(b.pass.avg_r, 2) + "R (" + b.pass.n + ")" : "—"}</td>
        <td class="${b.fail.avg_r > 0 ? "up" : b.fail.avg_r < 0 ? "down" : ""}">fail ${b.fail.n ? signed(b.fail.avg_r, 2) + "R (" + b.fail.n + ")" : "—"}</td></tr>`).join("")}
      </tbody></table></li>`);
  }
  const ic = j.factor_ic;
  if (ic) {
    rows.push(`<li><div class="meta"><span><span class="kind">Does the scan score predict the next move?</span></span></div>
      <div class="body">${ic.ic != null ? `Information Coefficient ${signed(ic.ic, 3)} across ${ic.pairs} session pairs` : "Not enough data yet"}</div>
      <div class="detail">${esc(ic.note || "")}${ic.ic == null ? "" : " (ML4Trading ch 1: rank correlation between today's score and the next session's move — 0 is no predictive power, ±1 is perfect)."}</div>
    </li>`);
  }
  return rows.join("");
}

async function fetchJournal(force = false) {
  if (!force && journalCache && Date.now() - journalCache._ts < 60000) return;
  try {
    const res = await fetch(`${API_BASE}/api/journal/summary`);
    const data = await res.json();
    data._ts = Date.now();
    journalCache = data;
  } catch (e) { /* backend not reachable yet */ }
  if (ui.right === "journal" && latestState) renderRight(latestState);
}

function renderRight(s) {
  const activity = s.activity || [];
  setHTML($("right-tabs"), tabsHTML("right", ui.right, [
    ["activity", "Activity", activity.length],
    ["trades", "Trades", s.trades.length],
    ["journal", "Journal"],
  ]));
  if (ui.right === "journal") {
    fetchJournal();
    return setHTML($("right-content"), journalHTML(journalCache));
  }
  if (ui.right === "activity") {
    setHTML($("right-content"), activity.length ? activity.map(a => `
      <li>
        <div class="meta"><span><span class="kind ${esc(a.kind)}">${esc(KIND_TEXT[a.kind] || a.kind)}</span>${a.symbol ? ` ${symLink(a.symbol)}` : ""}</span><span>${clock(a.ts)}</span></div>
        <div class="body">${esc(a.message)}</div>
      </li>`).join("") : `<li class="empty">Nothing yet. Scans, picks, trades and skipped signals appear here.</li>`);
  } else {
    const tax = s.tax || {turnover: 0, net_pnl: 0, charges: 0, closed_trades: 0};
    const taxNote = `<li class="tax">Intraday equity counts as <strong>speculative business income</strong>. So far: turnover <strong>₹${num(tax.turnover, 0)}</strong> (each closed trade's profit or loss, added up without signs), net P&amp;L <strong class="${tone(tax.net_pnl)}">${money(tax.net_pnl)}</strong>, estimated charges <strong>₹${num(tax.charges, 0)}</strong>. Speculative losses only offset speculative gains and carry forward 4 years. Advance tax is due by 15 Jun, 15 Sep, 15 Dec and 15 Mar. Source: Zerodha Varsity, Markets and Taxation; check with a CA.</li>`;
    setHTML($("right-content"), taxNote + (s.trades.length ? s.trades.map(t => {
      const action = tradeAction(t);
      const opening = action === "Bought" || action === "Sold short";
      const reason = REASON_TEXT[t.reason] || t.reason || "";
      return `<li>
        <div class="meta"><span><span class="kind ${opening ? (t.side === "BUY" ? "trade" : "error") : ""}">${action}</span> ${symLink(t.symbol)}${t.mode === "live" ? ` <span class="pill short">Live</span>` : ""}</span><span>${clock(t.ts)}</span></div>
        <div class="body">${t.quantity} shares at ${num(t.price)}</div>
        <div class="detail">${esc([reason, t.note].filter(Boolean).join(": "))}</div>
      </li>`;
    }).join("") : `<li class="empty">No orders yet today.</li>`));
  }
}

// ---- data + orchestration -------------------------------------------------

async function fetchNews(symbol, force = false) {
  if (!symbol) return;
  const cached = newsCache[symbol];
  if (!force && cached && Date.now() - cached._ts < 120000) return;
  try {
    const res = await fetch(`${API_BASE}/api/news/${encodeURIComponent(symbol)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    data._ts = Date.now();
    newsCache[symbol] = data;
  } catch (e) {
    newsCache[symbol] = { error: String(e.message || e), headlines: [], _ts: Date.now() };
  }
  if (latestState) renderStock(latestState);
}

function pickDefaultSymbol(s) {
  const valid = sym => sym && (rowFor(s, sym) || s.watchlist.includes(sym) || s.positions[sym]);
  if (userSelected && valid(selectedSymbol)) return;
  const rows = scanRows(s);
  const next = heldSymbols(s)[0] || (s.scanner && s.scanner.active[0]) || (rows[0] && rows[0].symbol) || s.watchlist[0] || null;
  if (next !== selectedSymbol) {
    selectedSymbol = next;
    if (next) fetchNews(next);
  }
}

function selectSymbol(sym) {
  selectedSymbol = sym;
  userSelected = true;
  fetchNews(sym);
  renderAll(latestState);
}

function renderAll(s) {
  if (!s) return;
  latestState = s;
  pickDefaultSymbol(s);
  renderTop(s);
  renderStance(s);
  renderOpps(s);
  renderStock(s);
  renderChart(s);
  renderPositions(s);
  renderRight(s);
}

async function setMode(paperMode) {
  await fetch(`${API_BASE}/api/mode`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ paper_mode: paperMode }),
  });
}

async function triggerScan(btn) {
  btn.disabled = true;
  btn.textContent = "Scanning…";
  try {
    const res = await fetch(`${API_BASE}/api/scan`, { method: "POST" });
    const data = await res.json();
    btn.textContent = data.started ? "Scan started" : "Already scanning";
  } catch (e) {
    btn.textContent = "Engine offline";
  }
  setTimeout(() => { btn.disabled = false; btn.textContent = "Scan now"; }, 8000);
}

document.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const btn = e.target.closest("button");
  if (!btn) return;
  if (btn.id === "btn-scan") return triggerScan(btn);
  if (btn.id === "btn-toggle-watch") { ui.showAllWatch = !ui.showAllWatch; return renderOpps(latestState); }
  if (btn.dataset.group) {
    ui[btn.dataset.group] = btn.dataset.tab;
    return renderAll(latestState);
  }
  if (btn.dataset.sym) selectSymbol(btn.dataset.sym);
});

$("btn-paper").onclick = () => setMode(true);
$("btn-live").onclick = () => {
  if (confirm("Switch to live trading? Trader Sahab will place real orders on Zerodha.")) setMode(false);
};

async function refreshKiteStatus() {
  try {
    const res = await fetch(`${API_BASE}/api/kite/status`);
    const k = await res.json();
    const label = $("kite-label");
    const btn = $("btn-connect-kite");
    if (k.connected && k.using_live_data) {
      label.textContent = "Kite live prices";
      btn.textContent = "Reconnect";
    } else if (k.connected) {
      label.textContent = "Kite connected";
      btn.textContent = "Reconnect";
    } else {
      label.textContent = k.app_configured ? "Kite not connected" : "Delayed prices";
      btn.textContent = "Connect Kite";
    }
  } catch (e) { /* backend not reachable yet */ }
}

$("btn-connect-kite").onclick = () => window.open(`${API_BASE}/kite/login`, "kite-login", "width=480,height=640");
window.addEventListener("focus", refreshKiteStatus);
setInterval(refreshKiteStatus, 15000);
refreshKiteStatus();

function connectWS() {
  const ws = new WebSocket(API_BASE.replace("http", "ws") + "/ws");
  ws.onmessage = evt => renderAll(JSON.parse(evt.data));
  ws.onclose = () => setTimeout(connectWS, 2000);
  ws.onerror = () => ws.close();
}

initChart();
connectWS();
setInterval(async () => {
  try {
    const res = await fetch(`${API_BASE}/api/state`);
    renderAll(await res.json());
  } catch (e) { /* the WebSocket is probably already delivering updates */ }
}, 10000);
setInterval(() => { if (selectedSymbol) fetchNews(selectedSymbol); }, 60000);
</script>
